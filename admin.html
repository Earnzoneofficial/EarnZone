
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnZone Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.container{max-width:950px;margin:30px auto}
.card{background:#151d32;padding:22px;border-radius:15px;margin-bottom:18px}
h1,h2{margin-top:0}
input{width:100%;padding:13px;margin:9px 0 16px;border:1px solid #34415e;border-radius:8px;background:#0b1020;color:white}
button{padding:11px 16px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold;cursor:pointer;margin:4px}
button:disabled{opacity:.5}
.reject{background:#dc2626}
.logout{background:#475569}
.request{border:1px solid #34415e;padding:15px;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}
.status{color:#fbbf24;font-weight:bold}
#dashboard{display:none}
#message{color:#fbbf24}
small{color:#aab5cc}
</style>
</head>
<body>
<div class="container">

<div class="card" id="loginBox">
<h1>EarnZone Admin</h1>
<p>Admin Login</p>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required
placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" required
placeholder="Admin password">
<button type="submit">Login</button>
</form>
 <div id="googleButton" style="margin-top:15px;"></div>
<p id="message"></p>
</div>

<div id="dashboard">
<div class="card">
<h1>Admin Dashboard</h1>
 <div class="card">
  <h2>User Statistics</h2>
  <p>Total Accounts: <strong id="totalUsers">0</strong></p>
  <p>Active Users: <strong id="activeUsers">0</strong></p>
  <p>Total User Balance: $<strong id="totalBalance">0.00</strong></p>
  <p>Total Coins: <strong id="totalCoins">0</strong></p>
</div>

<div class="card">
  <h2>All Users</h2>
  <button onclick="loadUsers()">Refresh Users</button>
  <div id="usersList">Loading users...</div>
</div>
<p>Withdrawal Requests</p>
<button onclick="loadWithdrawals()">Refresh Requests</button>
<button class="logout" onclick="logout()">Logout</button>
<p id="dashboardMessage"></p>
</div>

<div class="card">
<h2>All Withdrawal Requests</h2>
<div id="requests">Loading...</div>
</div>
</div>

</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');
const message = document.getElementById('message');

function showDashboard(){
 loginBox.style.display='none';
 dashboard.style.display='block';
 loadWithdrawals();
 loadUsers();
}

document.getElementById('loginForm').addEventListener('submit',async function(e){
 e.preventDefault();
 message.textContent='Logging in...';

 try{
  const response=await fetch('/api/admin/login',{
   method:'POST',
   credentials:'same-origin',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value
   })
  });

  const result=await response.json();

  if(!response.ok){
   message.textContent=result.error||'Login failed.';
   return;
  }

  showDashboard();
 }catch(error){
  message.textContent='Connection error. Try again.';
 }
});

async function checkAdmin(){
 try{
  const response=await fetch('/api/admin/me',{
   credentials:'same-origin'
  });

  if(response.ok){
   showDashboard();
  }
 }catch(error){}
}
async function loadUsers(){
 const box = document.getElementById('usersList');
 box.textContent = 'Loading users...';

 try{
  const response = await fetch('/api/admin/users', {
   credentials: 'same-origin'
  });

  const result = await response.json();

  if(!response.ok){
   box.textContent = result.error || 'Could not load users.';
   return;
  }

  document.getElementById('totalUsers').textContent =
   result.stats.total_users || 0;

  document.getElementById('activeUsers').textContent =
   result.stats.active_users || 0;

  document.getElementById('totalBalance').textContent =
   Number(result.stats.total_balance || 0).toFixed(2);

  document.getElementById('totalCoins').textContent =
   result.stats.total_coins || 0;

  box.replaceChildren();

  if(!result.users.length){
   box.textContent = 'No users registered yet.';
   return;
  }

  result.users.forEach(user => {
   const card = document.createElement('div');
   card.className = 'request';

   const details = document.createElement('p');
   details.textContent =
    'ID: ' + user.id +
    ' | Username: ' + user.username +
    ' | Email: ' + user.email +
    ' | Joined: ' + user.created_at;

   const income = document.createElement('p');
   income.textContent =
    'Coins: ' + user.coins +
    ' | Balance: $' + Number(user.balance_usd || 0).toFixed(2) +
    ' | Ad Income: $' + Number(user.ad_income || 0).toFixed(2) +
    ' | Referrals: ' + user.referrals +
    ' | Withdrawn: $' + Number(user.withdrawn || 0).toFixed(2);

   const status = document.createElement('p');
   status.textContent = 'Status: ' + user.status;

   card.append(details, income, status);
   box.append(card);
  });

 }catch(error){
  box.textContent = 'Connection error.';
 }
}
async function loadWithdrawals(){
 const box=document.getElementById('requests');
 box.textContent='Loading requests...';

 try{
  const response=await fetch('/api/admin/withdrawals',{
   credentials:'same-origin'
  });

  const result=await response.json();

  if(!response.ok){
   box.textContent=result.error||'Could not load requests.';
   return;
  }

  box.replaceChildren();

  if(!result.withdrawals||result.withdrawals.length===0){
   box.textContent='No withdrawal requests yet.';
   return;
  }

  result.withdrawals.forEach(item=>{
   const card=document.createElement('div');
   card.className='request';

   const details=document.createElement('p');
   details.textContent=
    'Request ID: '+item.id+
    ' | User: '+item.username+
    ' | Email: '+item.email+
    ' | Amount: $'+Number(item.amount_usd).toFixed(2)+
    ' | Method: '+item.method+
    ' | Account: '+item.account_details;

   const status=document.createElement('p');
   status.className='status';
   status.textContent='Status: '+item.status;

   card.append(details,status);

   if(item.status==='pending'){
    const approve=document.createElement('button');
    approve.textContent='Approve';
    approve.onclick=()=>processRequest(item.id,'approve',approve,reject);

    const reject=document.createElement('button');
    reject.textContent='Reject';
    reject.className='reject';
    reject.onclick=()=>processRequest(item.id,'reject',approve,reject);

    card.append(approve,reject);
   }

   box.append(card);
  });

 }catch(error){
  box.textContent='Connection error.';
 }
}

async function processRequest(id,action,approve,reject){
 if(!confirm('Are you sure you want to '+action+' this request?')){
  return;
 }

 approve.disabled=true;
 reject.disabled=true;

 try{
  const response=await fetch('/api/admin/withdrawals/'+id,{
   method:'POST',
   credentials:'same-origin',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({action})
  });

  const result=await response.json();

  alert(result.message||result.error||'Request completed.');
  await loadWithdrawals();

 }catch(error){
  alert('Connection error.');
  approve.disabled=false;
  reject.disabled=false;
 }
}

async function logout(){
 await fetch('/api/admin/logout',{
  method:'POST',
  credentials:'same-origin'
 });

 dashboard.style.display='none';
 loginBox.style.display='block';
 document.getElementById('password').value='';
 message.textContent='Logged out.';
}
function handleGoogleCredential(response) {
  message.textContent = 'Checking Google account...';

  fetch('/api/admin/google-login', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({credential: response.credential})
  })
  .then(async r => ({ok: r.ok, result: await r.json()}))
  .then(({ok, result}) => {
    if (!ok) {
      message.textContent = result.error || 'Google login failed.';
      return;
    }
    showDashboard();
  })
  .catch(() => {
    message.textContent = 'Connection error. Try again.';
  });
}

window.addEventListener('load', function() {
  google.accounts.id.initialize({
   client_id: '962833361527-lh5v38hm3vogu7gde5uh1edr9t02vdn6.apps.googleusercontent.com',
    callback: handleGoogleCredential
  });

  google.accounts.id.renderButton(
    document.getElementById('googleButton'),
    {theme: 'outline', size: 'large', text: 'continue_with', width: 260}
  );
});
checkAdmin();
</script>
</body>
</html>
